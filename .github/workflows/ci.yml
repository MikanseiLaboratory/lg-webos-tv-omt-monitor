name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-armv7:
    name: Check (armv7 webOS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned nightly with the armv7 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-01
          targets: armv7-unknown-linux-gnueabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # The webOS build uses --no-default-features (the C presenter owns SDL),
      # so check both configurations. `cargo check` needs no webOS sysroot and
      # does not codegen, which keeps this job off the soft-float LLVM path.
      - name: Check (armv7, no default features)
        run: >
          cargo check --locked --no-default-features
          --target armv7-unknown-linux-gnueabi
          --manifest-path app/Cargo.toml

      - name: Check (armv7, default features)
        run: >
          cargo check --locked
          --target armv7-unknown-linux-gnueabi
          --manifest-path app/Cargo.toml
