[package]
name = "omt-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "OMT (Open Media Transport) monitor for LG webOS TVs"

[features]
default = ["sdl2"]
sdl2 = []

[dependencies]
flate2 = "1"
# TODO: switch to the published crates once both are on crates.io:
#   openmediatransport = "0.2.2"
#   vmx = { version = "0.2.2", features = ["arm32-neon"] }
openmediatransport = { git = "https://github.com/MikanseiLaboratory/openmediatransport-rs", tag = "v0.2.2" }
vmx = { version = "0.2.2", features = ["arm32-neon"] }


[patch.crates-io]
vmx = { git = "https://github.com/MikanseiLaboratory/vmx-rs", tag = "v0.2.2" }

[profile.release]
lto = false
codegen-units = 1
