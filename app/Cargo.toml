[package]
name = "omt-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "OMT (Open Media Transport) monitor for LG webOS TVs"

[features]
default = ["sdl2"]
sdl2 = []

[dependencies]
flate2 = "1"
openmediatransport = { git = "https://github.com/MikanseiLaboratory/openmediatransport-rs" }
vmx = { version = "0.2", features = ["arm32-neon"] }


[patch.crates-io]
vmx = { git = "https://github.com/MikanseiLaboratory/vmx-rs", branch = "feat/armv7-neon" }

[profile.release]
lto = false
codegen-units = 1
