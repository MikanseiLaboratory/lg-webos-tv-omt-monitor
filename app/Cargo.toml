[package]
name = "omt-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "OMT (Open Media Transport) monitor for LG webOS TVs"

[features]
default = ["sdl2"]
sdl2 = []

[dependencies]
flate2 = "1"
openmediatransport = "0.2.2"
vmx = { version = "0.2.2", features = ["arm32-neon"] }

[profile.release]
lto = false
codegen-units = 1
